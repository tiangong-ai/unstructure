version: 1
layout: repo
lastReviewedAt: "2026-11-04"
lastReviewedCommit: "55852ab72073688884da6b2447c11b29c78c4071"

repo:
  id: unstructure

routing:
  intents:
    sci-document-work:
      paths:
        - SCI_DOCUMENT_WORKLOG.md
        - src/journals/**
        - _docs/runbooks/sci-local-server.md
        - _docs/reference/sci-evidence-index.md
    governance:
      paths:
        - AGENTS.md
        - .docpact/**
        - .github/workflows/docpact.yml
        - _docs/**
    architecture:
      paths:
        - src/**
        - docker/**
        - requirements.txt
    operations:
      paths:
        - README.md
        - requirements.txt
        - ecosystem*.json
        - docker/**
        - .vscode/**

coverage:
  include:
    - .gitignore
    - SCI_DOCUMENT_WORKLOG.md
    - AGENTS.md
    - README.md
    - .docpact/**
    - .github/workflows/docpact.yml
    - _docs/**
    - ecosystem*.json
    - requirements.txt
    - src/**
    - docker/**
    - .vscode/**
  exclude:
    - .git/**
    - .docpact/runs/**
    - .venv/**
    - __pycache__/**
    - "**/__pycache__/**"
    - .pytest_cache/**
    - .ruff_cache/**
    - dist/**
    - build/**
    - docs/**
    - processed_docs/**
    - test/queue/**
    - logs/**
    - "*.log"
    - .DS_Store
    - "**/.DS_Store"

docInventory:
  include:
    - SCI_DOCUMENT_WORKLOG.md
    - AGENTS.md
    - README.md
    - .docpact/config.yaml
    - _docs/**
    - src/**/AGENTS.md
  exclude:
    - .git/**
    - .docpact/runs/**
    - .venv/**
    - __pycache__/**
    - "**/__pycache__/**"
    - dist/**
    - build/**
    - docs/**
    - processed_docs/**
    - test/queue/**
    - logs/**

freshness:
  warn_after_commits: 50
  warn_after_days: 90
  critical_after_days: 180

rules:
  - id: unstructure-sci-worklog
    scope: module
    repo: unstructure
    triggers:
      - path: src/journals/**
        kind: sci-processing-source
      - path: SCI_DOCUMENT_WORKLOG.md
        kind: sci-work-diary
      - path: _docs/runbooks/sci-local-server.md
        kind: sci-execution-handoff
    requiredDocs:
      - path: SCI_DOCUMENT_WORKLOG.md
        mode: body_update_required
      - path: _docs/runbooks/sci-local-server.md
        mode: must_exist
      - path: _docs/reference/sci-evidence-index.md
        mode: must_exist
    reason: SCI changes must record issue scope, actual execution evidence and remaining data repair work in the diary.
  - id: unstructure-governance
    scope: repo
    repo: unstructure
    triggers:
      - path: .gitignore
        kind: evidence-publication-boundary
      - path: AGENTS.md
        kind: agent-contract
      - path: .docpact/config.yaml
        kind: machine-contract
      - path: .github/workflows/docpact.yml
        kind: governance-ci
      - path: _docs/**
        kind: governed-docs
      - path: README.md
        kind: repo-entry
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: _docs/README.md
        mode: review_or_update
      - path: _docs/contracts/repo-contract.md
        mode: review_or_update
      - path: _docs/standards/documentation-standards.md
        mode: review_or_update
    reason: Repository entry guidance, governance config, and documentation standards must remain aligned.
  - id: unstructure-processing-surface
    scope: repo
    repo: unstructure
    triggers:
      - path: src/**
        kind: document-processing-source
      - path: docker/**
        kind: local-service-stack
      - path: requirements.txt
        kind: python-dependencies
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: _docs/architecture/repo-architecture.md
        mode: review_or_update
      - path: src/journals/AGENTS.md
        mode: review_or_update
      - path: _docs/contracts/repo-contract.md
        mode: review_or_update
      - path: _docs/runbooks/development.md
        mode: review_or_update
    reason: Processing scripts, dependency facts, and local service stack changes must stay synchronized with architecture and runbook docs.
  - id: unstructure-operations
    scope: repo
    repo: unstructure
    triggers:
      - path: README.md
        kind: developer-guide
      - path: ecosystem*.json
        kind: process-manager-config
      - path: requirements.txt
        kind: dependency-lock-lite
      - path: .vscode/**
        kind: editor-workflow
    requiredDocs:
      - path: README.md
        mode: review_or_update
      - path: _docs/runbooks/development.md
        mode: review_or_update
      - path: _docs/contracts/repo-contract.md
        mode: review_or_update
    reason: Setup, dependency, editor, and operational command changes define how processing jobs are run.
